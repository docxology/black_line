# Machine-readable numeric support for the manuscript.
#
# Each row is keyed on the claim, not on the bare integer, so two unrelated
# claims that happen to share a value stay distinct. Every row is re-derived
# from the running package by tests/test_claim_ledger.py, which also refuses a
# row with no derivation and a derivation with no row — the ledger is checked,
# not merely declared. `source` names the file that re-derives the value;
# `source_tier` is `test` for every row, because every row has an executable
# derivation.
schema: black-line-claim-ledger-v2
claims:
